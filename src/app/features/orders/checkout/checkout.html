<div class="mx-auto max-w-md">
  <h1 class="mb-6 text-2xl font-bold text-slate-900">Thanh toán</h1>

  <div class="rounded-xl border border-slate-200 bg-white p-6">
    <p class="text-sm text-slate-500">
      Đây là bước thanh toán giả lập — chưa tích hợp cổng thanh toán thật. Đơn hàng sẽ được tạo
      với trạng thái <span class="font-medium text-slate-700">pending</span>.
    </p>

    @if (error()) {
      <p class="mt-3 text-sm text-red-600">{{ error() }}</p>
    }

    <button
      type="button"
      [disabled]="placing()"
      (click)="confirmOrder()"
      class="mt-6 w-full rounded-lg bg-indigo-600 px-4 py-3 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
    >
      {{ placing() ? 'Đang xử lý...' : 'Xác nhận đặt hàng' }}
    </button>

    <a routerLink="/cart" class="mt-3 block text-center text-sm text-slate-500 hover:underline">
      Quay lại giỏ hàng
    </a>
  </div>
</div>
