<section>
  <div class="mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-[22px] text-brand">stars</span>
      <h2 class="text-headline-2 text-neutral-900">Sản Phẩm Đề Xuất Nổi Bật</h2>
    </div>
    <a routerLink="/products" class="flex items-center gap-1 text-caption-bold text-brand hover:underline">
      <span>Xem toàn bộ danh mục gợi ý</span>
      <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
    </a>
  </div>

  @if (loading()) {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <div class="h-64 animate-pulse rounded-card bg-neutral-100"></div>
      }
    </div>
  } @else if (recommendations().length === 0) {
    <p class="text-body-regular text-neutral-600">Chưa có sản phẩm để gợi ý.</p>
  } @else {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
      @for (rec of recommendations(); track rec.productId) {
        <app-product-card
          [product]="rec.product"
          [badge]="coldStart() ? 'Bán chạy' : null"
          [matchScore]="coldStart() ? null : rec.score"
          (addToCart)="onAddToCart($event)"
        />
      }
    </div>
  }
</section>
