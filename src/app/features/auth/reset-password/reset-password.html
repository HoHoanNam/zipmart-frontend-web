<div class="mx-auto max-w-sm">
  <h1 class="mb-6 text-2xl font-bold text-slate-900">Đặt lại mật khẩu</h1>

  @if (done()) {
    <div class="rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700">
      Đặt lại mật khẩu thành công. Đang chuyển đến trang đăng nhập...
    </div>
  } @else {
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Mật khẩu mới</label>
        <input
          type="password"
          name="newPassword"
          required
          [(ngModel)]="newPassword"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">Xác nhận mật khẩu mới</label>
        <input
          type="password"
          name="confirmPassword"
          required
          [(ngModel)]="confirmPassword"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none"
        />
      </div>

      @if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
      >
        {{ loading() ? 'Đang xử lý...' : 'Đặt lại mật khẩu' }}
      </button>
    </form>
  }

  <p class="mt-4 text-center text-sm text-slate-500">
    <a routerLink="/login" class="font-medium text-indigo-600 hover:underline">Quay lại đăng nhập</a>
  </p>
</div>
