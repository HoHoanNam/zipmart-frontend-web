<div class="mt-2 flex items-center gap-2">
  <div class="flex items-center">
    @for (star of stars; track star) {
      <span
        class="material-symbols-outlined text-[18px]"
        [class.text-warning]="isFilled(star)"
        [class.text-neutral-300]="!isFilled(star)"
        [style.font-variation-settings]="isFilled(star) ? '\'FILL\' 1' : '\'FILL\' 0'"
        >star</span
      >
    }
  </div>
  @if (summary().count > 0) {
    <span class="text-body-regular text-neutral-600">
      {{ summary().average.toFixed(1) }} ({{ summary().count }} đánh giá)
    </span>
  } @else {
    <span class="text-body-regular text-neutral-600">Chưa có đánh giá</span>
  }
</div>
