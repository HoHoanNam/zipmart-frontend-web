<div class="flex items-center">
  @for (star of stars; track star) {
    <span
      class="material-symbols-outlined"
      [class]="size() === 'sm' ? 'text-[13px]' : 'text-[18px]'"
      [class.text-warning]="isFilled(star)"
      [class.text-neutral-300]="!isFilled(star)"
      [style.font-variation-settings]="isFilled(star) ? '\'FILL\' 1' : '\'FILL\' 0'"
      >star</span
    >
  }
</div>
