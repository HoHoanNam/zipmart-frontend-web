@if (categories().length > 0) {
  <section>
    <h2 class="mb-3 text-headline-3 text-neutral-900">Danh mục sản phẩm</h2>
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
      @for (category of categories(); track category.id) {
        <a
          [routerLink]="['/products']"
          [queryParams]="{ categoryId: category.id }"
          class="group flex flex-col items-center gap-2 rounded-card bg-white p-3 shadow-card transition-all duration-200 hover:-translate-y-0.5 hover:shadow-hover"
        >
          <div class="aspect-square w-full overflow-hidden rounded-control bg-neutral-50">
            <img
              [src]="imageFor(category)"
              [alt]="category.name"
              class="h-full w-full object-cover transition-transform duration-200 group-hover:scale-105"
            />
          </div>
          <span class="text-body-medium text-neutral-900 group-hover:text-brand">
            {{ category.name }}
          </span>
        </a>
      }
    </div>
  </section>
}
