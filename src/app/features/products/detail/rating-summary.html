<div class="mt-2 flex items-center gap-2">
  <app-star-rating [average]="summary().average" />
  @if (summary().count > 0) {
    <span class="text-body-regular text-neutral-600">
      {{ summary().average.toFixed(1) }} ({{ summary().count }} đánh giá)
    </span>
  } @else {
    <span class="text-body-regular text-neutral-600">Chưa có đánh giá</span>
  }
</div>
