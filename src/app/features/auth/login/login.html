<div class="mx-auto max-w-sm">
  <h1 class="mb-6 text-2xl font-bold text-slate-900">Đăng nhập</h1>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
      <input
        type="email"
        name="email"
        required
        [(ngModel)]="email"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Mật khẩu</label>
      <input
        type="password"
        name="password"
        required
        [(ngModel)]="password"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none"
      />
    </div>

    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
    >
      {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-slate-500">
    Chưa có tài khoản?
    <a routerLink="/register" class="font-medium text-indigo-600 hover:underline">Đăng ký</a>
  </p>
</div>
