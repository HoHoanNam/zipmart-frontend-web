<form (ngSubmit)="onSubmit()" class="rounded-card border border-neutral-100 bg-white p-4">
  <p class="mb-2 text-body-medium text-neutral-900">
    {{ editingReview() ? 'Sửa đánh giá của bạn' : 'Viết đánh giá' }}
  </p>

  <div class="mb-3 flex items-center gap-1">
    @for (star of stars; track star) {
      <button
        type="button"
        [attr.aria-label]="star + ' sao'"
        (click)="setRating(star)"
        class="p-0.5"
      >
        <span
          class="material-symbols-outlined text-[24px]"
          [class.text-warning]="star <= rating()"
          [class.text-neutral-300]="star > rating()"
          [style.font-variation-settings]="star <= rating() ? '\'FILL\' 1' : '\'FILL\' 0'"
          >star</span
        >
      </button>
    }
  </div>

  <textarea
    name="comment"
    [(ngModel)]="comment"
    rows="3"
    maxlength="2000"
    placeholder="Chia sẻ cảm nhận của bạn về sản phẩm..."
    class="w-full rounded-control border border-neutral-300 px-3 py-2 text-body-regular focus:border-brand focus:outline-none"
  ></textarea>

  @if (error()) {
    <p class="mt-2 text-caption text-danger">{{ error() }}</p>
  }

  <div class="mt-3 flex items-center gap-3">
    <button
      type="submit"
      [disabled]="comment.trim().length === 0"
      class="rounded-control bg-brand px-4 py-2 text-body-medium text-white hover:bg-brand-dark disabled:cursor-not-allowed disabled:bg-neutral-300"
    >
      {{ editingReview() ? 'Cập nhật' : 'Gửi đánh giá' }}
    </button>
    @if (editingReview()) {
      <button
        type="button"
        (click)="cancel.emit()"
        class="text-body-medium text-neutral-600 hover:text-neutral-900"
      >
        Huỷ
      </button>
    }
  </div>
</form>
