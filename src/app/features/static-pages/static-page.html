@if (content; as page) {
  <h1 class="mb-6 text-headline-2 text-neutral-900">{{ page.title }}</h1>

  <div class="space-y-6">
    @for (section of page.sections; track section.heading) {
      <div class="rounded-card border border-neutral-100 bg-white p-5">
        <h2 class="mb-2 text-body-medium font-semibold text-neutral-900">{{ section.heading }}</h2>
        @for (paragraph of section.body; track paragraph) {
          <p class="mb-2 text-body-regular text-neutral-600 last:mb-0">{{ paragraph }}</p>
        }
      </div>
    }
  </div>
} @else {
  <p class="text-body-regular text-neutral-600">Không tìm thấy nội dung.</p>
}
