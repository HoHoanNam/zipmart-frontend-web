<h1 class="mb-6 text-headline-1 text-neutral-900">Sản phẩm yêu thích</h1>

@if (loading()) {
  <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 xl:grid-cols-4">
    @for (i of [1, 2, 3, 4]; track i) {
      <div class="h-64 animate-pulse rounded-card bg-neutral-100"></div>
    }
  </div>
} @else if (visibleProducts().length === 0) {
  <div class="rounded-card border border-dashed border-neutral-300 p-10 text-center">
    <p class="text-body-regular text-neutral-600">Bạn chưa lưu sản phẩm yêu thích nào.</p>
    <a routerLink="/products" class="mt-3 inline-block text-body-medium text-brand hover:underline">
      Khám phá sản phẩm
    </a>
  </div>
} @else {
  <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 xl:grid-cols-4">
    @for (product of visibleProducts(); track product.id) {
      <app-product-card [product]="product" (addToCart)="onAddToCart($event)" />
    }
  </div>
}
