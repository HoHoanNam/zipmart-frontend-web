<section class="rounded-2xl bg-linear-to-r from-indigo-600 to-indigo-500 px-8 py-16 text-white">
  <h1 class="text-3xl font-bold sm:text-4xl">Mua sắm thông minh hơn với zipmart</h1>
  <p class="mt-3 max-w-xl text-indigo-100">
    Gợi ý sản phẩm được cá nhân hoá dựa trên hành vi mua sắm của bạn.
  </p>
  <a
    routerLink="/products"
    class="mt-6 inline-block rounded-lg bg-white px-5 py-2.5 text-sm font-semibold text-indigo-600 hover:bg-indigo-50"
  >
    Khám phá sản phẩm
  </a>
</section>

@if (authService.isAuthenticated()) {
  <app-rec-widget />
} @else {
  <div class="mt-10 rounded-xl border border-dashed border-slate-300 p-6 text-center">
    <p class="text-sm text-slate-500">
      <a routerLink="/login" class="font-medium text-indigo-600 hover:underline">Đăng nhập</a>
      để xem gợi ý sản phẩm dành riêng cho bạn.
    </p>
  </div>
}
