@if (isCancelled()) {
  <div class="flex items-center">
    <div class="flex flex-col items-center gap-1">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-brand text-white">
        <span class="material-symbols-outlined text-[18px]">receipt_long</span>
      </div>
      <span class="text-caption text-neutral-600">Đặt hàng</span>
    </div>
    <div class="mx-2 h-px flex-1 bg-danger/40"></div>
    <div class="flex flex-col items-center gap-1">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-danger text-white">
        <span class="material-symbols-outlined text-[18px]">cancel</span>
      </div>
      <span class="text-caption text-danger">Đã huỷ</span>
    </div>
  </div>
} @else {
  <div class="flex items-center">
    @for (step of steps(); track step.status; let last = $last) {
      <div class="flex flex-col items-center gap-1">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-full"
          [class.bg-brand]="step.done"
          [class.text-white]="step.done"
          [class.bg-neutral-100]="!step.done"
          [class.text-neutral-600]="!step.done"
        >
          <span class="material-symbols-outlined text-[18px]">{{ step.icon }}</span>
        </div>
        <span
          class="text-caption"
          [class.text-neutral-900]="step.done"
          [class.text-neutral-600]="!step.done"
        >
          {{ step.label }}
        </span>
      </div>
      @if (!last) {
        <div class="mx-2 h-px flex-1" [class.bg-brand]="step.done" [class.bg-neutral-100]="!step.done"></div>
      }
    }
  </div>
}
