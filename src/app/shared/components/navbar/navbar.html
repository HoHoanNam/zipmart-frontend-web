<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <a routerLink="/" class="text-xl font-bold text-indigo-600">zipmart</a>

    <div class="flex items-center gap-6 text-sm font-medium text-slate-600">
      <a routerLink="/" class="hover:text-indigo-600">Trang chủ</a>
      <a routerLink="/products" class="hover:text-indigo-600">Sản phẩm</a>

      @if (authService.isAuthenticated()) {
        <a routerLink="/orders" class="hover:text-indigo-600">Đơn hàng</a>
      }

      <a routerLink="/cart" class="relative hover:text-indigo-600">
        Giỏ hàng
        @if (cartService.itemCount() > 0) {
          <span class="absolute -right-3 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-indigo-600 px-1 text-xs text-white">
            {{ cartService.itemCount() }}
          </span>
        }
      </a>

      @if (authService.isAuthenticated()) {
        <button type="button" (click)="logout()" class="hover:text-indigo-600">Đăng xuất</button>
      } @else {
        <a routerLink="/login" class="hover:text-indigo-600">Đăng nhập</a>
        <a
          routerLink="/register"
          class="rounded-lg bg-indigo-600 px-3 py-1.5 text-white hover:bg-indigo-700"
        >
          Đăng ký
        </a>
      }
    </div>
  </nav>
</header>
