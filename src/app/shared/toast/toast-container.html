<div
  class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 sm:inset-x-auto sm:right-4 sm:items-end"
>
  @for (toast of toastService.toasts(); track toast.id) {
    @switch (toast.variant) {
      @case ('cart') {
        <div
          class="animate-toast-slide-up pointer-events-auto flex items-center gap-3 rounded-control bg-brand px-4 py-3 text-body-medium text-white shadow-hover"
        >
          <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
          <span>{{ toast.message }}</span>
          <button
            type="button"
            aria-label="Đóng thông báo"
            (click)="toastService.dismiss(toast.id)"
            class="ml-1 text-white/80 hover:text-white"
          >
            ✕
          </button>
        </div>
      }
      @case ('wishlist') {
        <div
          class="animate-toast-scale-in pointer-events-auto flex items-center gap-3 rounded-control border border-danger bg-white px-4 py-3 text-body-medium text-neutral-900 shadow-hover"
        >
          <span
            class="material-symbols-outlined text-[20px] text-danger"
            style="font-variation-settings: 'FILL' 1"
            >favorite</span
          >
          <span>{{ toast.message }}</span>
          <button
            type="button"
            aria-label="Đóng thông báo"
            (click)="toastService.dismiss(toast.id)"
            class="ml-1 text-neutral-400 hover:text-neutral-600"
          >
            ✕
          </button>
        </div>
      }
      @case ('profile') {
        <div
          class="animate-toast-slide-up pointer-events-auto flex items-center gap-3 rounded-control border border-neutral-200 bg-white px-4 py-3 text-body-medium text-neutral-900 shadow-hover"
        >
          <span class="material-symbols-outlined text-[20px] text-brand">check_circle</span>
          <span>{{ toast.message }}</span>
          <button
            type="button"
            aria-label="Đóng thông báo"
            (click)="toastService.dismiss(toast.id)"
            class="ml-1 text-neutral-400 hover:text-neutral-600"
          >
            ✕
          </button>
        </div>
      }
    }
  }
</div>
