@if (visible()) {
  <div
    class="fixed inset-x-4 bottom-4 z-30 flex items-center justify-between gap-4 rounded-card border border-neutral-100 bg-white p-4 shadow-hover sm:inset-x-auto sm:right-6 sm:w-96"
  >
    <div class="flex items-center gap-3">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-control bg-brand/10 text-brand">
        <span class="material-symbols-outlined text-[22px]">install_mobile</span>
      </span>
      <div>
        <p class="text-body-medium font-semibold text-neutral-900">Cài đặt zipmart</p>
        <p class="text-caption text-neutral-600">Truy cập nhanh hơn ngay từ màn hình chính.</p>
      </div>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <button
        type="button"
        (click)="dismiss()"
        class="rounded-control px-2 py-1.5 text-caption text-neutral-600 hover:bg-neutral-100"
      >
        Để sau
      </button>
      <button
        type="button"
        (click)="install()"
        class="rounded-control bg-brand px-3 py-1.5 text-caption-bold text-white hover:bg-brand-dark"
      >
        Cài đặt
      </button>
    </div>
  </div>
}
