<a
  [routerLink]="['/products', product().id]"
  class="group flex flex-col rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md hover:-translate-y-0.5"
>
  @if (badge()) {
    <span class="mb-2 inline-flex w-fit items-center rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-800">
      {{ badge() }}
    </span>
  }

  <div class="flex h-28 items-center justify-center rounded-lg bg-slate-100 text-slate-400">
    <span class="text-sm">{{ product().name.charAt(0).toUpperCase() }}</span>
  </div>

  <h3 class="mt-3 line-clamp-2 text-sm font-medium text-slate-900 group-hover:text-indigo-600">
    {{ product().name }}
  </h3>

  <div class="mt-1 flex items-center justify-between">
    <span class="text-base font-semibold text-slate-900">{{ product().price | vndCurrency }}</span>
    <span class="text-xs text-slate-500">
      {{ product().stock > 0 ? 'Còn ' + product().stock : 'Hết hàng' }}
    </span>
  </div>

  <button
    type="button"
    [disabled]="product().stock === 0"
    (click)="onAddToCart($event)"
    class="mt-3 w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300"
  >
    Thêm vào giỏ
  </button>
</a>
